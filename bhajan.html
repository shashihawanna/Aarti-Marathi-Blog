<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>आरती भजन | आरती संग्रह</title>
<meta name="description" content="मराठी आरती व भक्तिगीत संग्रह — आरती भजन">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&display=swap');

:root{
  --red:#e51b2a;
  --dark:#292929;
  --paper:#fffdfb;
  --bg:#f3f4f8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%, rgba(229,27,42,.07), transparent 24%),
    radial-gradient(circle at 90% 90%, rgba(229,27,42,.06), transparent 22%),
    var(--bg);
  color:var(--dark);
  font-family:"Noto Serif Devanagari","Nirmala UI","Mangal",serif;
}
.site-header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:2px solid var(--red);
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}
.header-inner{
  max-width:1180px;
  margin:auto;
  padding:18px 20px 14px;
}
.brand{
  text-align:center;
  color:var(--red);
  font-size:clamp(25px,4vw,42px);
  font-weight:700;
  margin:0 0 12px;
}
.menu{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
.menu a{
  color:var(--red);
  text-decoration:none;
  border:1px solid rgba(229,27,42,.45);
  border-radius:22px;
  padding:7px 13px;
  background:#fff;
  font-size:15px;
  transition:.2s ease;
}
.menu a:hover,.menu a.active{
  color:#fff;
  background:var(--red);
}
.page{
  width:min(1120px,calc(100% - 28px));
  margin:32px auto 50px;
}
.card{
  position:relative;
  background:var(--paper);
  border:3px solid var(--red);
  border-radius:28px;
  padding:26px 22px 34px;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
  overflow:hidden;
}
.card:before,.card:after{
  content:"✿";
  position:absolute;
  color:var(--red);
  font-size:44px;
  line-height:1;
  top:8px;
}
.card:before{left:12px}
.card:after{right:12px}
.corner{
  position:absolute;
  width:28px;height:28px;
  border:3px solid var(--red);
}
.corner.tl{left:9px;top:9px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.corner.tr{right:9px;top:9px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.corner.bl{left:9px;bottom:9px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.corner.br{right:9px;bottom:9px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.title{
  color:var(--red);
  text-align:center;
  font-size:clamp(28px,5vw,54px);
  font-weight:700;
  margin:8px 55px 24px;
}
.image-wrap{
  display:flex;
  justify-content:center;
}
.devotional-image{
  display:block;
  width:min(100%,920px);
  height:auto;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}
.note{
  text-align:center;
  margin:22px auto 0;
  font-size:16px;
  color:#666;
}
.footer{
  text-align:center;
  padding:24px 16px 40px;
  color:#777;
  font-size:14px;
}
.back{
  display:inline-block;
  margin-top:18px;
  padding:9px 18px;
  border-radius:22px;
  color:#fff;
  background:var(--red);
  text-decoration:none;
}
@media(max-width:650px){
  .header-inner{padding:12px 10px}
  .menu{gap:5px}
  .menu a{font-size:13px;padding:6px 9px}
  .page{width:calc(100% - 12px);margin:16px auto 30px}
  .card{border-width:2px;border-radius:20px;padding:18px 9px 24px}
  .title{margin-left:40px;margin-right:40px}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1 class="brand">॥ श्री आरती संग्रह ॥</h1>
    <nav class="menu" aria-label="आरती मेनू"><a class="" href="ganpati.html">1. गणपतीची आरती</a>
<a class="" href="durga.html">2. दुर्गादेवीची आरती</a>
<a class="" href="shankar.html">3. शंकराची आरती</a>
<a class="" href="vitthal.html">4. विठोबाची आरती</a>
<a class="" href="datta.html">5. आरती दत्ताची</a>
<a class="active" href="bhajan.html">6. आरती भजन</a>
<a class="" href="samarpop.html">7. समारोप</a></nav>
  </div>
</header>

<main class="page">
  <article class="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <h2 class="title">आरती भजन</h2>
    <div class="image-wrap">
      <img class="devotional-image" src="assets/bhajan.png" alt="आरती भजन">
    </div>
    <p class="note">॥ भक्तिभावाने पठण करा ॥</p>
    <div style="text-align:center">
      <a class="back" href="index.html">मुख्य पृष्ठावर परत जा</a>
    </div>
  </article>
</main>

<footer class="footer">॥ श्री गणेशाय नमः ॥ &nbsp; • &nbsp; ॥ श्रीराम ॥ &nbsp; • &nbsp; ॥ श्री दत्तात्रेय ॥</footer>
</body>
</html>
